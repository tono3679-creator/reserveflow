name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reserveflow
      AUTH_PROVIDER: local
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit / DB tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Prepare database for E2E
        run: |
          npm run db:local:reset
          SEED_LOGIN_PASSWORD=ci-login-password npm run db:seed
      - run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test
        env:
          E2E_COMMAND: npx next start -p 3100
          # CI のテスト専用の値（本番の秘密ではない。本番は Vercel の環境変数に別の値を登録する）
          APP_SECRET: ci-only-app-secret-for-e2e-0123456789abcdef
          E2E_LOGIN_PASSWORD: ci-login-password
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
